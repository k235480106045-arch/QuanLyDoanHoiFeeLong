<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - ĐOÀN HỘI FEE TNUT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
.password-wrapper { position:relative; }
.password-wrapper input { padding-right:40px; }
.toggle-password {
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    cursor:pointer; user-select:none; font-size:18px; line-height:1; color:#888;
}
</style>
</head>
<body class="login-body">
    <div class="login-container">
        <h2>THIẾT LẬP MẬT KHẨU</h2>
        <p class="login-subtitle">Đây là lần đầu bạn đăng nhập. Vui lòng đổi mật khẩu để bảo mật tài khoản!</p>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/change-password" method="POST">
            <div class="form-group">
                <label>Mật khẩu mới</label>
                <div class="password-wrapper">
                    <input type="password" name="new_password" placeholder="Nhập mật khẩu mới..." required>
                    <span class="toggle-password" onclick="togglePassword(this)">👁</span>
                </div>
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <div class="password-wrapper">
                    <input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu mới..." required>
                    <span class="toggle-password" onclick="togglePassword(this)">👁</span>
                </div>
            </div>
            <button type="submit">Cập nhật mật khẩu</button>
        </form>
    </div>
<script>
function togglePassword(el) {
    var input = el.parentElement.querySelector('input');
    if (input.type === 'password') { input.type = 'text'; el.textContent = '🙈'; }
    else { input.type = 'password'; el.textContent = '👁'; }
}
</script>
</body>
</html>
